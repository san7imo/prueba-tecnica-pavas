services:
  mysql:
    image: mysql:8.4
    container_name: pavas-workshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pavas_workshop}
      MYSQL_TEST_DATABASE: ${DB_NAME_TEST:-pavas_workshop_test}
      MYSQL_USER: ${DB_USER:-pavas}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_for_local_development}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_for_local_root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
